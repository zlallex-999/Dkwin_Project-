name: Build Dkwin Boss Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Buildozer
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --user --upgrade buildozer cython virtualenv
      - name: Build APK
        run: |
          yes | buildozer init
          sed -i 's/^title = .*/title = Dkwin Boss Pro/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.2.1,kivymd==1.1.1,numpy,pyjnius/' buildozer.spec
          sed -i 's/^#android.permissions = .*/android.permissions = SYSTEM_ALERT_WINDOW,BIND_ACCESSIBILITY_SERVICE,INTERNET,WRITE_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/^#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Dkwin_Boss_Pro
          path: bin/*.apk
