name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install buildozer cython==0.29.33
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Build with Buildozer
        run: |
          buildozer init
          # আপনার অ্যাপের নাম এবং রিকোয়ারমেন্টস সেট করা হচ্ছে
          sed -i 's/^package.name = .*/package.name = dkwin_boss/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.2.1,kivymd==1.1.1,numpy,opencv-python,pytesseract,sqlite3/' buildozer.spec
          sed -i 's/^#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: dkwin_app
          path: bin/*.apk
